services:
  - type: web
    name: wm-weekly-mailer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wm-db
          property: connectionString
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      # Brevo (HTTPS email API — no SMTP ports needed, works on Render free tier)
      # Sign up free at https://app.brevo.com → API Keys → Create API Key
      # Free plan: 300 emails/day. No credit card required.
      - key: BREVO_API_KEY
        sync: false
      # Must be a verified sender in your Brevo account (Settings → Senders & IP)
      - key: BREVO_SENDER_EMAIL
        sync: false
      # Use brevo for HTTPS email (avoids Render's SMTP port block)
      - key: SEND_MODE
        value: brevo
      - key: COMPANY_NAME
        value: FORBES MARSHALL HYD PVT LTD
      - key: FLASK_ENV
        value: production

databases:
  - name: wm-db
    plan: free
